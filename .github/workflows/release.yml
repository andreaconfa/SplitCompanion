name: Publish approved release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.lock && python -m pytest backend/tests -q
      - run: python -m ruff check backend/app backend/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: frontend
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --log-opts=--all --redact
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - name: Validate version and image name
        id: names
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-rc\.\d+)?',tag): raise SystemExit('Invalid release tag')
          namespace={};exec(Path('backend/app/version.py').read_text(),namespace)
          if namespace['SERVER_VERSION']!=tag[1:]: raise SystemExit('Tag/version mismatch')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('image=ghcr.io/'+os.environ['REPOSITORY'].lower()+'\nversion='+tag[1:]+'\n')
          PY
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - run: python3 scripts/container-smoke.py --image "$IMAGE"
        env:
          IMAGE: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          image-ref: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Record remaining high and critical findings
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          image-ref: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
          format: json
          output: security-scan.json
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE"
        env:
          IMAGE: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
      - name: Attach corresponding source and image digest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" > image-digests.txt
          python3 scripts/make-source-archive.py --output splitcompanion-source.tar.gz
          cp .env.example env.example
          sha256sum splitcompanion-source.tar.gz image-digests.txt security-scan.json compose.yaml env.example > SHA256SUMS
          gh release upload "$RELEASE_TAG" splitcompanion-source.tar.gz SHA256SUMS image-digests.txt security-scan.json compose.yaml env.example
