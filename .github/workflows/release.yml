name: Publish approved release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements-dev.lock && python -m pytest backend/tests -q
      - run: python -m ruff check backend/app backend/tests
      - run: python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: frontend
      - name: English/Italian browser and currency regression checks
        working-directory: frontend
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/split-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5174/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/localization.browser.mjs
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --log-opts=--all --redact
  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - name: Validate version and image name
        id: names
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-rc\.\d+)?',tag): raise SystemExit('Invalid release tag')
          namespace={};exec(Path('backend/app/version.py').read_text(),namespace)
          if namespace['SERVER_VERSION']!=tag[1:]: raise SystemExit('Tag/version mismatch')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('image=ghcr.io/'+os.environ['REPOSITORY'].lower()+'\nversion='+tag[1:]+'\n')
          PY
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}-${{ matrix.arch }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - run: python3 scripts/container-smoke.py --image "$IMAGE"
        env:
          IMAGE: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}-${{ matrix.arch }}
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          image-ref: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}-${{ matrix.arch }}
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Record remaining high and critical findings
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.76.1
          image-ref: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}-${{ matrix.arch }}
          format: json
          output: security-scan.json
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE"
        env:
          IMAGE: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}-${{ matrix.arch }}
      - name: Build Home Assistant adapter
        uses: docker/build-push-action@v6
        with:
          context: .
          target: homeassistant
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ steps.names.outputs.image }}-homeassistant:${{ steps.names.outputs.version }}-${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ steps.names.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - run: python3 scripts/homeassistant-smoke.py --image "$IMAGE"
        env:
          IMAGE: ${{ steps.names.outputs.image }}-homeassistant:${{ steps.names.outputs.version }}-${{ matrix.arch }}
      - run: docker push "$IMAGE"
        env:
          IMAGE: ${{ steps.names.outputs.image }}-homeassistant:${{ steps.names.outputs.version }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ matrix.arch }}
          path: security-scan.json
  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: security-scan-*
          path: scans
      - name: Publish tested multi-architecture manifests and release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-aarch64"
          docker buildx imagetools create -t "$IMAGE-homeassistant:$VERSION" "$IMAGE-homeassistant:$VERSION-amd64" "$IMAGE-homeassistant:$VERSION-aarch64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" > image-digests.txt
          docker buildx imagetools inspect "$IMAGE-homeassistant:$VERSION" >> image-digests.txt
          python3 scripts/make-source-archive.py --output splitcompanion-source.tar.gz
          cp scans/security-scan-amd64/security-scan.json security-scan-amd64.json
          cp scans/security-scan-aarch64/security-scan.json security-scan-arm64.json
          cp .env.example env.example
          sha256sum splitcompanion-source.tar.gz image-digests.txt security-scan-*.json compose.yaml env.example > SHA256SUMS
          gh release upload "$RELEASE_TAG" splitcompanion-source.tar.gz SHA256SUMS image-digests.txt security-scan-*.json compose.yaml env.example
